<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Garden 🌸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #f0e6ff 0%, #e6f4ea 50%, #fff3e0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen {
    display: none;
    width: 100%;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
  }
  .screen.active { display: flex; }

  /* ── START SCREEN ── */
  #startScreen {
    background: linear-gradient(160deg, #fff8f0 0%, #f0fff4 100%);
  }
  #startScreen .garden-title {
    font-size: clamp(2.4rem, 8vw, 4rem);
    color: #6b4f8a;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  #startScreen .tagline {
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    color: #7a8c7e;
    margin-bottom: 48px;
    max-width: 500px;
  }
  .flowers-decoration {
    font-size: 3rem;
    margin-bottom: 32px;
    animation: gentle-sway 4s ease-in-out infinite;
  }
  @keyframes gentle-sway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  .start-btn {
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    padding: 20px 56px;
    border-radius: 60px;
    border: none;
    background: linear-gradient(135deg, #9b7ac7, #c7a7e0);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(155,122,199,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: 'Georgia', serif;
  }
  .start-btn:hover, .start-btn:active {
    transform: scale(1.05);
    box-shadow: 0 12px 40px rgba(155,122,199,0.6);
  }

  /* ── GAME SCREEN ── */
  #gameScreen {
    background: transparent;
    max-width: 700px;
    margin: 0 auto;
  }

  .progress-bar-wrap {
    width: 90%;
    max-width: 500px;
    height: 10px;
    background: rgba(255,255,255,0.6);
    border-radius: 20px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #9b7ac7, #67c7a4);
    border-radius: 20px;
    transition: width 0.8s ease;
  }

  .instruction {
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    color: #5a3e7a;
    margin-bottom: 32px;
    font-weight: bold;
    max-width: 560px;
    line-height: 1.4;
    min-height: 70px;
  }

  /* ── FLOWER GAME ── */
  .flower-display {
    font-size: clamp(6rem, 20vw, 10rem);
    margin-bottom: 32px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
    transition: transform 0.4s ease;
  }
  .flower-display:hover { transform: scale(1.05); }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    width: 90%;
    max-width: 420px;
  }
  .option-btn {
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    padding: 20px 16px;
    border-radius: 20px;
    border: 3px solid rgba(255,255,255,0.8);
    background: white;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    font-family: 'Georgia', serif;
    color: #4a3060;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    min-height: 70px;
  }
  .option-btn:hover, .option-btn:active { transform: scale(1.04); box-shadow: 0 8px 24px rgba(0,0,0,0.14); }
  .option-btn.correct { background: #d4f5e2; border-color: #67c7a4; animation: pulse-correct 0.5s ease; }
  .option-btn.wrong { background: #fde8e8; border-color: #e88; animation: shake 0.4s ease; }
  @keyframes pulse-correct { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  /* ── PAIRS GAME ── */
  .pairs-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 92%;
    max-width: 460px;
  }
  .card {
    aspect-ratio: 1;
    border-radius: 16px;
    border: 3px solid rgba(255,255,255,0.8);
    background: linear-gradient(135deg, #c9b3e8, #a89ed4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    user-select: none;
    min-height: 64px;
  }
  .card .face { display: none; }
  .card .back { display: flex; font-size: clamp(1.4rem,5vw,2rem); color: rgba(255,255,255,0.7); }
  .card.flipped .face { display: flex; }
  .card.flipped .back { display: none; }
  .card.flipped { background: white; border-color: #9b7ac7; transform: scale(1.05); }
  .card.matched { background: #d4f5e2; border-color: #67c7a4; cursor: default; }
  .card.matched .face { display: flex; }
  .card.matched .back { display: none; }

  /* ── SPOT THE DIFFERENCE ── */
  .std-container {
    display: flex;
    gap: 20px;
    width: 92%;
    max-width: 600px;
    justify-content: center;
  }
  .std-image-wrap {
    position: relative;
    flex: 1;
    max-width: 260px;
  }
  .std-label {
    font-size: 1rem;
    color: #7a6a8a;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .std-canvas-wrap {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    background: white;
    cursor: pointer;
  }
  .std-canvas-wrap canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 20px;
  }
  .std-hint {
    position: absolute;
    border: 3px solid #f7b731;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
    box-shadow: 0 0 20px rgba(247,183,49,0.6);
  }
  .std-hint.visible { opacity: 1; }
  .std-click-marker {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(103,199,164,0.4);
    border: 3px solid #67c7a4;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: ripple 0.6s ease forwards;
  }
  @keyframes ripple { 0%{transform:translate(-50%,-50%) scale(0.5);opacity:1} 100%{transform:translate(-50%,-50%) scale(2);opacity:0} }

  /* ── SUCCESS BURST ── */
  #burst {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1000;
  }
  .star {
    position: absolute;
    font-size: 2.5rem;
    animation: star-fly 1.2s ease forwards;
    opacity: 0;
  }
  @keyframes star-fly {
    0% { transform: translate(0,0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* ── WELL DONE SCREEN ── */
  #wellDoneScreen {
    background: linear-gradient(160deg, #f0fff4 0%, #fff8f0 100%);
  }
  .well-done-emoji { font-size: clamp(4rem, 12vw, 7rem); margin-bottom: 20px; }
  .well-done-title {
    font-size: clamp(2rem, 7vw, 3.5rem);
    color: #4a7a5e;
    margin-bottom: 16px;
  }
  .well-done-msg {
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    color: #7a8c7e;
    margin-bottom: 48px;
    max-width: 440px;
    line-height: 1.6;
  }
  .play-again-btn {
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    padding: 18px 48px;
    border-radius: 60px;
    border: none;
    background: linear-gradient(135deg, #67c7a4, #4aab8a);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(103,199,164,0.5);
    font-family: 'Georgia', serif;
    transition: transform 0.2s;
  }
  .play-again-btn:hover { transform: scale(1.05); }

  /* ── SCORE STRIP ── */
  .score-strip {
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: #8a7aaa;
    margin-top: 28px;
  }
  .score-strip span { font-weight: bold; color: #5a3e7a; }
</style>
</head>
<body>

<!-- ═══ START SCREEN ═══ -->
<div id="startScreen" class="screen active">
  <div class="flowers-decoration">🌸🌼🌺</div>
  <h1 class="garden-title">Memory Garden</h1>
  <p class="tagline">A gentle journey through colors, shapes, and flowers.</p>
  <button class="start-btn" onclick="startGame()">🌿 Let's Begin</button>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div id="gameScreen" class="screen">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="instruction" id="instruction">Loading...</div>
  <div id="exerciseArea"></div>
  <div class="score-strip">Round <span id="roundNum">1</span> of <span id="roundTotal">9</span></div>
</div>

<!-- ═══ WELL DONE SCREEN ═══ -->
<div id="wellDoneScreen" class="screen">
  <div class="well-done-emoji">🌟</div>
  <h1 class="well-done-title">Wonderful!</h1>
  <p class="well-done-msg">You did a beautiful job today. Every answer was a small victory. 💛</p>
  <button class="play-again-btn" onclick="startGame()">🌸 Play Again</button>
</div>

<!-- Burst container -->
<div id="burst"></div>

<script>
// ══════════════════════════════════════════
//  AUDIO ENGINE
// ══════════════════════════════════════════
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, duration = 0.4, type = 'sine', vol = 0.18, delay = 0) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.05);
  } catch(e) {}
}

function playSuccessChime() {
  // gentle ascending chime
  const notes = [523, 659, 784, 1047]; // C5 E5 G5 C6
  notes.forEach((f, i) => playTone(f, 0.5, 'sine', 0.15, i * 0.15));
}

function playCalmAmbience() {
  // soft pad tones
  const chords = [261, 329, 392]; // C4 E4 G4
  chords.forEach((f, i) => playTone(f, 2.5, 'sine', 0.06, i * 0.1));
}

function playWrongTone() {
  playTone(220, 0.3, 'sine', 0.1);
}

// ══════════════════════════════════════════
//  SPEECH
// ══════════════════════════════════════════
function speak(text, onEnd) {
  if (!window.speechSynthesis) { if (onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 0.78;
  utt.pitch = 1.05;
  utt.volume = 1;
  // prefer a warm female voice if available
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /female|samantha|karen|moira|victoria|tessa/i.test(v.name));
  if (preferred) utt.voice = preferred;
  if (onEnd) utt.onend = onEnd;
  window.speechSynthesis.speak(utt);
}

// voices load async
window.speechSynthesis && window.speechSynthesis.addEventListener('voiceschanged', () => {});

// ══════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════
const TOTAL_ROUNDS = 9;
let currentRound = 0;
let canInput = false;

// Exercise sequence: 3× flower, 3× pairs, 3× spot
const exerciseTypes = [
  'flower','flower','flower',
  'pairs','pairs','pairs',
  'spot','spot','spot'
];

// Shuffle helper
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ══════════════════════════════════════════
//  FLOWER DATA
// ══════════════════════════════════════════
const flowers = [
  { emoji: '🌸', color: 'Pink',   emoji2: '🌸' },
  { emoji: '🌼', color: 'Yellow', emoji2: '🌼' },
  { emoji: '🌺', color: 'Red',    emoji2: '🌺' },
  { emoji: '💐', color: 'Purple', emoji2: '💐' },
  { emoji: '🌻', color: 'Orange', emoji2: '🌻' },
  { emoji: '🤍', color: 'White',  emoji2: '🤍' },
];
const colorOptions = ['Pink','Yellow','Red','Purple','Orange','White','Blue','Green'];

// ══════════════════════════════════════════
//  PAIRS DATA
// ══════════════════════════════════════════
const pairEmojis = ['🌸','🦋','🐝','🍀','🌈','🐢','🌙','🍓'];

// ══════════════════════════════════════════
//  SPOT THE DIFFERENCE DATA
// ══════════════════════════════════════════
// Each scene is drawn on a canvas; one detail differs
const scenes = [
  {
    name: 'garden',
    draw: (ctx, w, h, variant) => drawGarden(ctx, w, h, variant)
  },
  {
    name: 'sky',
    draw: (ctx, w, h, variant) => drawSky(ctx, w, h, variant)
  },
  {
    name: 'pond',
    draw: (ctx, w, h, variant) => drawPond(ctx, w, h, variant)
  },
];

// ══════════════════════════════════════════
//  MAIN GAME LOOP
// ══════════════════════════════════════════
function startGame() {
  currentRound = 0;
  showScreen('gameScreen');
  nextRound();
}

function nextRound() {
  if (currentRound >= TOTAL_ROUNDS) {
    endGame();
    return;
  }
  document.getElementById('roundNum').textContent = currentRound + 1;
  document.getElementById('roundTotal').textContent = TOTAL_ROUNDS;
  document.getElementById('progressFill').style.width = ((currentRound / TOTAL_ROUNDS) * 100) + '%';

  const type = exerciseTypes[currentRound];
  if (type === 'flower') buildFlowerExercise();
  else if (type === 'pairs') buildPairsExercise();
  else buildSpotExercise();
}

function onCorrect() {
  canInput = false;
  playSuccessChime();
  showBurst();
  setTimeout(() => {
    playCalmAmbience();
    currentRound++;
    setTimeout(nextRound, 1400);
  }, 900);
}

// ══════════════════════════════════════════
//  FLOWER EXERCISE
// ══════════════════════════════════════════
function buildFlowerExercise() {
  canInput = false;
  const flower = flowers[Math.floor(Math.random() * flowers.length)];
  const correct = flower.color;

  // pick 3 wrong options
  const wrongs = shuffle(colorOptions.filter(c => c !== correct)).slice(0, 3);
  const opts = shuffle([correct, ...wrongs]);

  const area = document.getElementById('exerciseArea');
  area.innerHTML = `
    <div class="flower-display">${flower.emoji}</div>
    <div class="options-grid" id="colorGrid"></div>
  `;

  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => handleFlowerAnswer(btn, opt === correct);
    document.getElementById('colorGrid').appendChild(btn);
  });

  const instruction = document.getElementById('instruction');
  instruction.textContent = 'What color is this flower?';
  speak('What color is this flower?', () => { canInput = true; });
}

function handleFlowerAnswer(btn, isCorrect) {
  if (!canInput) return;
  canInput = false;
  if (isCorrect) {
    btn.classList.add('correct');
    setTimeout(onCorrect, 400);
  } else {
    btn.classList.add('wrong');
    playWrongTone();
    setTimeout(() => {
      btn.classList.remove('wrong');
      canInput = true;
    }, 700);
  }
}

// ══════════════════════════════════════════
//  MATCHING PAIRS EXERCISE
// ══════════════════════════════════════════
let pairsState = { flipped: [], matched: 0, total: 0, lock: false };

function buildPairsExercise() {
  canInput = false;
  const chosen = shuffle(pairEmojis).slice(0, 4);
  const cards = shuffle([...chosen, ...chosen]);
  pairsState = { flipped: [], matched: 0, total: chosen.length, lock: false };

  const area = document.getElementById('exerciseArea');
  area.innerHTML = `<div class="pairs-grid" id="pairsGrid"></div>`;

  cards.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.dataset.index = i;
    card.innerHTML = `<span class="face">${emoji}</span><span class="back">🌿</span>`;
    card.onclick = () => handleCardClick(card);
    document.getElementById('pairsGrid').appendChild(card);
  });

  const instruction = document.getElementById('instruction');
  instruction.textContent = 'Find the matching pairs!';
  speak('Find the matching pairs. Tap two cards to turn them over.', () => { canInput = true; });
}

function handleCardClick(card) {
  if (!canInput) return;
  if (pairsState.lock) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

  card.classList.add('flipped');
  playTone(660, 0.2, 'sine', 0.12);
  pairsState.flipped.push(card);

  if (pairsState.flipped.length === 2) {
    pairsState.lock = true;
    const [a, b] = pairsState.flipped;
    if (a.dataset.emoji === b.dataset.emoji) {
      a.classList.add('matched');
      b.classList.add('matched');
      a.classList.remove('flipped');
      b.classList.remove('flipped');
      pairsState.flipped = [];
      pairsState.matched++;
      pairsState.lock = false;
      playTone(880, 0.3, 'sine', 0.14);
      if (pairsState.matched === pairsState.total) {
        setTimeout(onCorrect, 500);
      }
    } else {
      playWrongTone();
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        pairsState.flipped = [];
        pairsState.lock = false;
      }, 1100);
    }
  }
}

// ══════════════════════════════════════════
//  SPOT THE DIFFERENCE EXERCISE
// ══════════════════════════════════════════
let stdDiff = null; // { x, y, r } in canvas-fraction coords

function buildSpotExercise() {
  canInput = false;
  const scene = scenes[Math.floor(Math.random() * scenes.length)];
  const SIZE = 240;

  // Difference position (random-ish but visible)
  stdDiff = {
    xf: 0.3 + Math.random() * 0.4,
    yf: 0.25 + Math.random() * 0.5,
    rf: 0.1
  };

  const area = document.getElementById('exerciseArea');
  area.innerHTML = `
    <div class="std-container">
      <div class="std-image-wrap">
        <div class="std-label">Picture A</div>
        <div class="std-canvas-wrap" id="wrapA">
          <canvas id="canvasA" width="${SIZE}" height="${SIZE}"></canvas>
        </div>
      </div>
      <div class="std-image-wrap">
        <div class="std-label">Picture B</div>
        <div class="std-canvas-wrap" id="wrapB">
          <canvas id="canvasB" width="${SIZE}" height="${SIZE}"></canvas>
          <div class="std-hint" id="stdHint"></div>
        </div>
      </div>
    </div>
  `;

  const ctxA = document.getElementById('canvasA').getContext('2d');
  const ctxB = document.getElementById('canvasB').getContext('2d');
  scene.draw(ctxA, SIZE, SIZE, 0);
  scene.draw(ctxB, SIZE, SIZE, 1); // variant 1 has difference

  // Place hint circle
  const hint = document.getElementById('stdHint');
  const hw = SIZE * stdDiff.rf * 2;
  hint.style.width = hw + 'px';
  hint.style.height = hw + 'px';
  hint.style.left = (stdDiff.xf * 100 - stdDiff.rf * 100) + '%';
  hint.style.top = (stdDiff.yf * 100 - stdDiff.rf * 100) + '%';

  document.getElementById('wrapB').onclick = (e) => handleStdClick(e);

  const instruction = document.getElementById('instruction');
  instruction.textContent = 'Tap where the pictures are different!';
  speak('Look at both pictures. Tap where they are different.', () => { canInput = true; });
}

function handleStdClick(e) {
  if (!canInput) return;
  const wrap = document.getElementById('wrapB');
  const rect = wrap.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;

  // Show click marker
  const marker = document.createElement('div');
  marker.className = 'std-click-marker';
  marker.style.left = (x * 100) + '%';
  marker.style.top = (y * 100) + '%';
  wrap.appendChild(marker);
  setTimeout(() => marker.remove(), 700);

  const dx = x - stdDiff.xf;
  const dy = y - stdDiff.yf;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist < stdDiff.rf + 0.15) {
    canInput = false;
    document.getElementById('stdHint').classList.add('visible');
    setTimeout(onCorrect, 700);
  } else {
    playWrongTone();
  }
}

// ══════════════════════════════════════════
//  SCENE DRAWING
// ══════════════════════════════════════════
function drawGarden(ctx, w, h, variant) {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.6);
  sky.addColorStop(0, '#c9e8ff');
  sky.addColorStop(1, '#e8f4ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  // Ground
  const ground = ctx.createLinearGradient(0, h * 0.55, 0, h);
  ground.addColorStop(0, '#a8d57a');
  ground.addColorStop(1, '#7ab84a');
  ctx.fillStyle = ground;
  ctx.fillRect(0, h * 0.55, w, h * 0.45);

  // Sun
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath();
  ctx.arc(w * 0.15, h * 0.18, w * 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Flowers
  const fdata = [
    { x: 0.2, color: '#e91e63' },
    { x: 0.45, color: '#ffeb3b' },
    { x: 0.7, color: '#9c27b0' },
    { x: 0.88, color: '#ff5722' },
  ];
  fdata.forEach((f, i) => {
    const fx = w * f.x;
    const fy = h * 0.55;
    // stem
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx, fy - h * 0.16);
    ctx.stroke();
    // petals
    // variant 1: change one flower color
    let c = f.color;
    if (variant === 1 && i === Math.floor(stdDiff.xf * fdata.length)) {
      c = '#2196f3'; // blue - the difference
    }
    ctx.fillStyle = c;
    for (let p = 0; p < 5; p++) {
      const ang = (p / 5) * Math.PI * 2;
      const px = fx + Math.cos(ang) * w * 0.045;
      const py = (fy - h * 0.16) + Math.sin(ang) * w * 0.045;
      ctx.beginPath();
      ctx.ellipse(px, py, w * 0.04, w * 0.025, ang, 0, Math.PI * 2);
      ctx.fill();
    }
    // center
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath();
    ctx.arc(fx, fy - h * 0.16, w * 0.025, 0, Math.PI * 2);
    ctx.fill();
  });

  // Clouds
  drawCloud(ctx, w * 0.5, h * 0.15, w * 0.12);
  drawCloud(ctx, w * 0.78, h * 0.1, w * 0.09);
}

function drawSky(ctx, w, h, variant) {
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#1a237e');
  sky.addColorStop(1, '#4a148c');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  // Moon
  ctx.fillStyle = '#fff9e6';
  ctx.beginPath();
  ctx.arc(w * 0.75, h * 0.22, w * 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Stars
  const starPos = [
    {x:0.1,y:0.1},{x:0.25,y:0.08},{x:0.4,y:0.15},{x:0.55,y:0.06},
    {x:0.18,y:0.28},{x:0.35,y:0.32},{x:0.6,y:0.25},{x:0.85,y:0.35},
    {x:0.08,y:0.42},{x:0.5,y:0.4},{x:0.7,y:0.1},
  ];
  starPos.forEach((s, i) => {
    // variant 1: one star is bigger (the difference)
    const isSpecial = (variant === 1 && i === 3);
    const r = isSpecial ? w * 0.045 : w * 0.018;
    ctx.fillStyle = isSpecial ? '#ffd740' : '#ffffff';
    drawStar(ctx, w * s.x, h * s.y, r, 5);
  });

  // Silhouette trees
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, h * 0.7, w, h * 0.3);
  [[0.1,0.7,0.08],[0.3,0.68,0.07],[0.55,0.72,0.06],[0.75,0.67,0.09],[0.9,0.71,0.07]].forEach(([x,y,r]) => {
    ctx.beginPath();
    ctx.moveTo(w*x, h*y);
    ctx.lineTo(w*(x-r), h*0.95);
    ctx.lineTo(w*(x+r), h*0.95);
    ctx.closePath();
    ctx.fill();
  });
}

function drawPond(ctx, w, h, variant) {
  // Background
  ctx.fillStyle = '#b2dfdb';
  ctx.fillRect(0, 0, w, h);

  // Pond
  ctx.fillStyle = '#4dd0e1';
  ctx.beginPath();
  ctx.ellipse(w*0.5, h*0.55, w*0.38, h*0.22, 0, 0, Math.PI*2);
  ctx.fill();

  // Lily pads
  const pads = [{x:0.38,y:0.52},{x:0.58,y:0.5},{x:0.48,y:0.62}];
  pads.forEach((p, i) => {
    const isSpecial = variant === 1 && i === 1;
    ctx.fillStyle = isSpecial ? '#ff9800' : '#66bb6a'; // orange vs green
    ctx.beginPath();
    ctx.arc(w*p.x, h*p.y, w*0.06, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(w*p.x, h*p.y - h*0.03, w*0.025, 0, Math.PI*2);
    ctx.fill();
  });

  // Reeds
  [[0.15,0.35],[0.22,0.3],[0.8,0.32],[0.87,0.28]].forEach(([x,y]) => {
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(w*x, h*0.9);
    ctx.lineTo(w*x, h*y);
    ctx.stroke();
    ctx.fillStyle = '#795548';
    ctx.beginPath();
    ctx.ellipse(w*x, h*y, w*0.02, h*0.06, 0, 0, Math.PI*2);
    ctx.fill();
  });

  // Ground
  ctx.fillStyle = '#a5d6a7';
  ctx.fillRect(0, h*0.78, w, h*0.22);

  // Sky
  const skyG = ctx.createLinearGradient(0,0,0,h*0.25);
  skyG.addColorStop(0,'#e3f2fd');
  skyG.addColorStop(1,'#b3e5fc');
  ctx.fillStyle = skyG;
  ctx.fillRect(0,0,w,h*0.28);
  drawCloud(ctx, w*0.3, h*0.1, w*0.1);
  drawCloud(ctx, w*0.7, h*0.12, w*0.08);
}

function drawCloud(ctx, cx, cy, r) {
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.arc(cx + r*0.7, cy - r*0.15, r*0.75, 0, Math.PI*2);
  ctx.arc(cx + r*1.4, cy, r*0.6, 0, Math.PI*2);
  ctx.fill();
}

function drawStar(ctx, cx, cy, r, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const ang = (i * Math.PI) / points - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.4;
    i === 0 ? ctx.moveTo(cx + rad * Math.cos(ang), cy + rad * Math.sin(ang))
             : ctx.lineTo(cx + rad * Math.cos(ang), cy + rad * Math.sin(ang));
  }
  ctx.closePath();
  ctx.fill();
}

// ══════════════════════════════════════════
//  BURST ANIMATION
// ══════════════════════════════════════════
const burstEmojis = ['⭐','🌟','✨','💛','🌸','🎉','💚','🌼'];
function showBurst() {
  const burst = document.getElementById('burst');
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  for (let i = 0; i < 12; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    el.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
    const ang = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 160;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    el.style.animationDelay = (Math.random() * 0.2) + 's';
    burst.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }
}

// ══════════════════════════════════════════
//  END GAME
// ══════════════════════════════════════════
function endGame() {
  showScreen('wellDoneScreen');
  playSuccessChime();
  setTimeout(() => playCalmAmbience(), 600);
  speak('Wonderful! You did a beautiful job today. Well done!');
}

// ══════════════════════════════════════════
//  SCREEN SWITCHER
// ══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Resume AudioContext on any touch/click
document.addEventListener('click', () => getAudioCtx(), { once: true });
document.addEventListener('touchstart', () => getAudioCtx(), { once: true });
</script>
